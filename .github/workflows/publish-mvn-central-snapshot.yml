name: Publish SNAPSHOT to Maven Central

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CENTRAL_SNAPSHOTS_URL: https://central.sonatype.com/repository/maven-snapshots/

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Out Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare Gradle Build
        uses: ./.github/actions/prepare-gradle-build
        with:
          java-version: '8'

      - name: Publish SNAPSHOT to Maven Central Snapshots Repo
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          ./gradlew -PpublishGroupId=org.nordix \
            -PdeploymentRepository="${CENTRAL_SNAPSHOTS_URL}" \
            -PdeploymentRepositoryUsername="${MAVEN_USERNAME}" \
            -PdeploymentRepositoryPassword="${MAVEN_PASSWORD}" \
            publishAllPublicationsToDeploymentRepository

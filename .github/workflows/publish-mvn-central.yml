name: Publish to Maven Central

# Publishes the framework artifacts to Maven Central (Sonatype Central Portal)
# under the org.nordix groupId.
#
# Flow:
#   1. Build all modules once into deployment-repository/ with org.nordix
#      coordinates (the build action forwards -PpublishGroupId; the build's
#      internal org.springframework group is left untouched).
#   2. Delegate signing + Central Portal upload to the
#      sync-to-maven-central-portal composite action.
#
# Required repository secrets:
#   MAVEN_TOKEN      - base64("username:password") Central Portal token, used
#                      directly as the Authorization: Bearer value
#   GPG_PRIVATE_KEY  - ASCII-armored GPG private key
#   GPG_PASSPHRASE   - passphrase for the GPG private key

on:
  workflow_dispatch:
    inputs:
      publishing-type:
        description: 'Central Portal publishing type'
        required: true
        type: choice
        default: 'USER_MANAGED'
        options:
          - USER_MANAGED   # staged in the Portal UI for manual review/release
          - AUTOMATIC      # validated and released automatically

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish-to-central:
    name: Build and Publish to Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Out Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Single build that stages every module into ./deployment-repository with
      # org.nordix coordinates.
      - name: Build and Publish Locally
        id: build-and-publish
        uses: ./.github/actions/build
        with:
          publish: true
          publish-group-id: org.nordix

      - name: Sync to Maven Central Portal
        id: sync
        uses: ./.github/actions/sync-to-maven-central-portal
        with:
          deployment-repository: ${{ github.workspace }}/deployment-repository
          publishing-type: ${{ github.event.inputs.publishing-type }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          central-token: ${{ secrets.MAVEN_TOKEN }}

      - name: Summary
        run: |
          echo "### Published to Maven Central" >> "$GITHUB_STEP_SUMMARY"
          echo "- groupId: \`org.nordix\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.build-and-publish.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publishing type: \`${{ github.event.inputs.publishing-type }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: \`${{ steps.sync.outputs.deployment-id }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.publishing-type }}" = "USER_MANAGED" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Review and release the deployment at https://central.sonatype.com/publishing/deployments" >> "$GITHUB_STEP_SUMMARY"
          fi

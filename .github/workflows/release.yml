name: Release
on:
  push:
    tags:
      - 'v5.3.39-est-[0-9]'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-stage-release:
    if: ${{ github.repository == 'Nordix/spring-framework' }}
    name: Build and Stage Release
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build and Publish
        id: build-and-publish
        uses: ./.github/actions/build
        with:
          publish: true
      - name: Stage Release
        uses: spring-io/artifactory-deploy-action@26bbe925a75f4f863e1e529e85be2d0093cac116 # v0.0.1
        with:
          uri: 'https://artifactory.nordix.org'
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}
          build-name: ${{ format('spring-framework-{0}', steps.build-and-publish.outputs.version)}}
          repository: 'allies-mvn'
          folder: 'deployment-repository'
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          artifact-properties: |
            /**/spring-*.zip::zip.name=spring-framework,zip.deployed=false
            /**/spring-*-docs.zip::zip.type=docs
            /**/spring-*-dist.zip::zip.type=dist
            /**/spring-*-schema.zip::zip.type=schema
    outputs:
      version: ${{ steps.build-and-publish.outputs.version }}

name: 'Build'
description: 'Builds the project, optionally publishing it to a local deployment repository'
inputs:
  java-version:
    required: false
    default: '8'
    description: 'The Java version to compile and test with'
  java-toolchain:
    required: false
    default: 'false'
    description: 'Whether a Java toolchain should be used'
  publish:
    required: false
    default: 'false'
    description: 'Whether to publish artifacts ready for deployment to Artifactory'
  publish-group-id:
    required: false
    default: 'org.nordix'
    description: 'Overrides the groupId used for published artifacts (passed as -PpublishGroupId). When empty, the build default is used.'

outputs:
  version:
    description: 'The version that was built'
    value: ${{ steps.read-version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Prepare Gradle Build
      uses: ./.github/actions/prepare-gradle-build
      with:
        java-version: ${{ inputs.java-version }}
        java-toolchain: ${{ inputs.java-toolchain }}
    - name: Build
      id: build
      if: ${{ inputs.publish == 'false' }}
      shell: bash
      run: ./gradlew check
    - name: Publish
      id: publish
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      env:
        PUBLISH_GROUP_ID: ${{ inputs.publish-group-id }}
      run: |
        args=()
        if [ -n "${PUBLISH_GROUP_ID}" ]; then
          args+=("-PpublishGroupId=${PUBLISH_GROUP_ID}")
        fi
        ./gradlew -PdeploymentRepository=$(pwd)/deployment-repository "${args[@]}" build publishAllPublicationsToDeploymentRepository
    - name: Read Version From gradle.properties
      id: read-version
      shell: bash
      run: |
        version=$(sed -n 's/version=\(.*\)/\1/p' gradle.properties)
        echo "Version is $version"
        echo "version=$version" >> $GITHUB_OUTPUT

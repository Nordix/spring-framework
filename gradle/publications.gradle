apply plugin: "maven-publish"

publishing {
	publications {
		mavenJava(MavenPublication) {
			// Publish artifacts under a dedicated groupId while the build's internal
			// `group` (org.springframework) is left untouched so project dependency
			// resolution, version management, and the BOM behave as normal.
			groupId = project.findProperty("publishGroupId") ?: "org.nordix"
			pom {
				afterEvaluate {
					name = project.description
					description = project.description
				}
				url = "https://github.com/spring-projects/spring-framework"
				organization {
					name = "Spring IO"
					url = "https://spring.io/projects/spring-framework"
				}
				licenses {
					license {
						name = "Apache License, Version 2.0"
						url = "https://www.apache.org/licenses/LICENSE-2.0"
						distribution = "repo"
					}
				}
				scm {
					url = "https://github.com/spring-projects/spring-framework"
					connection = "scm:git:git://github.com/spring-projects/spring-framework"
					developerConnection = "scm:git:git://github.com/spring-projects/spring-framework"
				}
				developers {
					developer {
						id = "jhoeller"
						name = "Juergen Hoeller"
						email = "jhoeller@pivotal.io"
					}
				}
				issueManagement {
					system = "GitHub"
					url = "https://github.com/spring-projects/spring-framework/issues"
				}
			}
			versionMapping {
				usage('java-api') {
					fromResolutionResult()
				}
				usage('java-runtime') {
					fromResolutionResult()
				}
			}
		}
	}
}

configureDeploymentRepository(project)

void configureDeploymentRepository(Project project) {
	project.plugins.withType(MavenPublishPlugin.class).all {
		PublishingExtension publishing = project.getExtensions().getByType(PublishingExtension.class);
		if (project.hasProperty("deploymentRepository")) {
			publishing.repositories.maven {
				it.url = project.property("deploymentRepository")
				it.name = "deployment"
				// Optional credentials for publishing directly to an authenticated
				// remote repository (e.g. the Central Portal snapshots repo). When no
				// username is provided the repository is used without credentials,
				// preserving the local-folder release flow.
				if (project.hasProperty("deploymentRepositoryUsername")) {
					it.credentials {
						it.username = project.property("deploymentRepositoryUsername")
						it.password = project.findProperty("deploymentRepositoryPassword")
					}
				}
			}
		}
	}
}